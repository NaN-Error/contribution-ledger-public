[project]
name = "contribution-ledger-api"
version = "0.17.8"
description = "Contribution ledger local foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.133.0",
  "argon2-cffi==25.1.0",
  "uvicorn==0.48.0",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.1.6",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.3",
  "Pillow==13.0.0",
  "boto3==1.43.18",
  "cryptography==50.0.0",
]

[project.optional-dependencies]
jobs = ["celery==5.6.3", "redis==6.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires an explicitly configured disposable PostgreSQL database"]

[tool.coverage.run]
source = ["app"]
