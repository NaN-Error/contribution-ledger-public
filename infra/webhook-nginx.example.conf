# EXAMPLE ONLY. Not installed or enabled by any script. Requires an operator-owned
# public hostname, real certificate and HTTPS edge. Keep the ledger UI local.
# Put limit_req_zone in the nginx http{} block, not inside server{}.
limit_req_zone $binary_remote_addr zone=ledger_hooks:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name YOUR_WEBHOOK_HOST;
    ssl_certificate /YOUR/CERTIFICATE/fullchain.pem;
    ssl_certificate_key /YOUR/CERTIFICATE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off; # Do not log signed bodies or credential-bearing headers.
    client_max_body_size 1m;
    client_body_timeout 8s;
    location = /api/v1/github/webhook {
        limit_req zone=ledger_hooks burst=20 nodelay;
        limit_req_status 429;
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 404; }
        proxy_pass http://127.0.0.1:8010;
        proxy_request_buffering on;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }
    location / { return 404; }
}
